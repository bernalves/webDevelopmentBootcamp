<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Modelo de Formulário</h1>
    <form action="/tacos">
        <p>
            <label for="dueDate">Selecione a data desejada:</label>
            <input id="dueDate" type="date">
        </p>
        <p>
            <label for="budget">Qual o orçamento disponível?</label>
            <input id="budget" type="number" placeholder="Valor do orçamento">
        </p>
        <p>
            <label for="comments">Comentários Adicionais:</label>
            <input id="comments" type="text" placeholder="Descreva o motivo desse orçamento.">
        </p>
        <button>Enviar orçamento</button>
    </form>
</body>

</html>
